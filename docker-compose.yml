# UniFlow Finance — Optimized Docker Compose for Home Server
# Copy .env.example to .env and fill in your values before deploying.

services:
  # ── Backend API ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uniflow-backend
    init: true                      # Proper signal handling (SIGTERM → shutdown)
    restart: always                 # Auto-restart on crash or host reboot
    stop_grace_period: 10s
    ports:
      - "${BACKEND_PORT:-5050}:5000"
    env_file:
      - .env                        # Root .env (host ports, AI keys)
      - backend/.env                # Backend-specific overrides
    environment:
      - NODE_ENV=production
      - PORT=5000                   # Must match Dockerfile EXPOSE & nginx proxy_pass
      - DB_STORAGE=/app/data/database.sqlite
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMMA_PROVIDER=${GEMMA_PROVIDER:-groq}
      - GEMMA_API_KEY=${GEMMA_API_KEY:-${GROQ_API_KEY:-}}
      - GEMMA_MODEL=${GEMMA_MODEL:-openai/gpt-oss-120b}
    volumes:
      - uniflow-data:/app/data      # Persistent SQLite database
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - uniflow-net

  # ── Frontend (Nginx + React build) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uniflow-frontend
    init: true
    restart: always
    stop_grace_period: 10s
    user: "101:101"                 # Nginx default non-root user
    ports:
      - "${FRONTEND_PORT:-5070}:80"
    env_file:
      - .env
    environment:
      - REACT_APP_API_URL=/api/finance
    # Only start frontend once the backend is healthy
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - uniflow-net

# ── Persistent Data ─────────────────────────────────────────────
volumes:
  uniflow-data:
    name: uniflow_sqlite_data
    driver: local

# ── Isolated Network ────────────────────────────────────────────
networks:
  uniflow-net:
    driver: bridge
    name: uniflow_network
